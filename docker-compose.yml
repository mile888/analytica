services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      PORT: 8000
      ANALYTICA_RUNTIME_DIR: /app/.analytica/runtime
      ANALYTICA_UPLOAD_DIR: /app/.analytica/uploads
      ANALYTICA_ARTIFACT_DIR: /app/artifacts
      ANALYTICA_CORS_ORIGINS: ${ANALYTICA_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - analytica_runtime:/app/.analytica
      - analytica_artifacts:/app/artifacts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      PORT: 3000
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  analytica_runtime:
  analytica_artifacts:

defaults:
  provider: openrouter
  model: openai/gpt-4o-mini
# defaults:
#   provider: ollama
#   model: llama3
  engine: pandas          # pandas | polars | spark
  temperature: 1.0
  max_tokens: null
  timeout: null
  max_retries: 2

providers:
  openrouter:
    api_key_env: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api/v1"
    model: openai/gpt-4o-mini

  gemini:
    api_key_env: GEMINI_API_KEY

  openai:
    api_key_env: OPEN_API_TOKEN
    model: gpt-4o-mini

  ollama:
    base_url: "http://localhost:11434"
    model: llama3.2:3b

# Deep Agent runtime override.
# The old router/planner/codegen/critic/reporter pipeline has been removed;
# the Deep Agent itself now decides which tools and skills to use.
node_overrides:
  deep_agent:
    temperature: 0.2
  semantic_planner:
    temperature: 0.0
  semantic_compatibility:
    temperature: 0.0
